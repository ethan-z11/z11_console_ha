<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 家庭控制台标志：深色圆角底 + 暖光，实心琥珀色房子，中间圆窗里一盏亮着的灯。tools/make_icons.py 按同样的图形生成 PNG。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a3036"/>
      <stop offset="1" stop-color="#111417"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="36" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4b764" stop-opacity=".32"/>
      <stop offset="1" stop-color="#f4b764" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="house" x1="0" y1="14.5" x2="0" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbd495"/>
      <stop offset="1" stop-color="#e5953c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="32" cy="36.5" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4b764" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f4b764" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#glow)"/>
  <path d="M17 31 32 17.5 47 31v17H17Z" fill="url(#house)" stroke="url(#house)" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="32" cy="36.5" r="7" fill="#15181c"/>
  <circle cx="32" cy="36.5" r="7" fill="url(#lamp)"/>
  <circle cx="32" cy="36.5" r="2.8" fill="#fff3dc"/>
</svg>
